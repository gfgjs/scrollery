# 显式列出成员：`crates/*` 会命中无 Cargo.toml 的中间目录，并漏掉嵌套 worker。
# raw-worker/raw-probe 因工具链限制使用独立 workspace，见各自 Cargo.toml。
# 显式使用 resolver 2，避免虚拟 workspace 回退到 resolver 1 后改变 feature 合并行为。
[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/exotic-protocol",
    "crates/exotic-workers/psd-worker",
    "crates/exotic-workers/psd-probe",
    "crates/exotic-workers/ai-worker",
    "crates/exotic-workers/enhance-worker",
    "crates/exotic-workers/video-worker",
    "crates/exotic-workers/native-thumbnail-worker",
    "crates/scrollery-plugin-api",
    "crates/scrollery-exotic-trust",
    "crates/scrollery-ai-core",
]

# 应用版本由 src-tauri 继承，Tauri 使用 CARGO_PKG_VERSION。
# 升版后运行 `node scripts/sync-version.mjs --write` 同步 package.json；CI 校验版本与 tag。
# 内部协议与 worker 保留各自版本。
[workspace.package]
version = "0.1.0"
# 第一方许可（2026-09-14 决议）：主程序第一方源码统一 AGPL-3.0-only，不附链接例外；商业授权单独签署、
# 经明确授权后生效，不改变任何人依 AGPL 取得的权利（见 docs/legal/COMMERCIAL.md）。未来独立商业组件另定、不预承诺。
# 各 member 经 `license.workspace = true` 继承；独立 workspace(raw-worker/raw-probe)各自声明。
license = "AGPL-3.0-only"

# 构建 profile 仅在 workspace 根生效。
# 保留默认 unwind，让 catch_unwind 隔离图像解码器的坏文件 panic，避免中止整个进程。
# 开发构建优化解码、缩放、压缩热路径，其余本地 crate 保留默认优化等级以利于增量编译。
# 按包名覆盖适用于同名的全部版本；泛型代码在调用方单态化，纯 trait 桥接包无需单独覆盖。
[profile.dev.package.image]
opt-level = 2
[profile.dev.package.image-webp]
opt-level = 2
# 缩放和占位图生成同属开发构建热路径。
[profile.dev.package.fast_image_resize]
opt-level = 2
[profile.dev.package.thumbhash]
opt-level = 2
# libwebp 的 C 编码器也读取本包 OPT_LEVEL，开发构建需同步优化，避免缩略图编码拖慢扫描。
[profile.dev.package.webp]
opt-level = 2
[profile.dev.package.libwebp-sys]
opt-level = 2
[profile.dev.package.zune-jpeg]
opt-level = 2
[profile.dev.package.zune-core]
opt-level = 2
[profile.dev.package.png]
opt-level = 2
[profile.dev.package.gif]
opt-level = 2
[profile.dev.package.tiff]
opt-level = 2
[profile.dev.package.color_quant]
opt-level = 2
[profile.dev.package.weezl]
opt-level = 2
[profile.dev.package.fdeflate]
opt-level = 2
[profile.dev.package.flate2]
opt-level = 2
[profile.dev.package.miniz_oxide]
opt-level = 2
[profile.dev.package.adler2]
opt-level = 2
[profile.dev.package.crc32fast]
opt-level = 2
[profile.dev.package.moxcms]
opt-level = 2
[profile.dev.package.bytemuck]
opt-level = 2
[profile.dev.package.byteorder-lite]
opt-level = 2
[profile.dev.package.ndarray]
opt-level = 2

# 本地推理核单独优化 CLIP 预处理与输出搬运，避免开发构建供料跟不上推理。
[profile.dev.package.scrollery-ai-core]
opt-level = 2

[profile.release]
lto       = "thin"
opt-level = 3
strip     = true

# Lite profile 优先体积，用法：tauri build --profile lite。
# 同样保留 unwind，以隔离图像解码器的坏文件 panic。
[profile.lite]
inherits      = "release"
opt-level     = "z"
lto           = "fat"
codegen-units = 1
strip         = true
