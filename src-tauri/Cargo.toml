[package]
name = "scrollery"
version.workspace = true # 应用版本由根 workspace 统一定义
description = "Scrollery — High-performance cross-platform media asset manager"
authors = ["Scrollery Contributors"]
license.workspace = true # 第一方许可:AGPL-3.0-only(根 [workspace.package] 单一事实源)
edition = "2021"
default-run = "scrollery"

[lib]
name = "scrollery_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# ── Tauri core ──────────────────────────────────────────────────────────────
# 生产包默认关闭 inspector，诊断构建按需使用 --features devtools。
tauri          = { version = "2", features = ["protocol-asset", "unstable", "tray-icon"] }
tauri-plugin-dialog       = "2"
tauri-plugin-shell        = "2"
# 前端通过 platform() 选择平台窗口装饰，权限为 os:default。
tauri-plugin-os           = "2"
# 仅在受限 IPC 校验路径后调用 reveal_item_in_dir，不向 WebView 注册 opener 插件权限。
tauri-plugin-opener       = "2"
# 直销更新器仅在最终配置包含 plugins.updater 时注册。
tauri-plugin-updater      = "2"

# ── Async runtime ────────────────────────────────────────────────────────────
tokio      = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
# 备份/导出可写探针使用独占匿名文件，句柄关闭后清理，不覆盖或误删用户路径。
tempfile = "3"

# ── Database ─────────────────────────────────────────────────────────────────
rusqlite   = { version = "0.31", features = ["bundled", "collation", "functions"] }
r2d2       = "0.8"
r2d2_sqlite = "0.24"

# ── Serialisation ─────────────────────────────────────────────────────────────
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# ── Error handling ────────────────────────────────────────────────────────────
thiserror  = "1"

# ── 高吞吐哈希（S3.2）────────────────────────────────────────────────────────────
# FxHash 用于自产媒体 id 的内部索引，减少布局换代时的哈希成本。
rustc-hash = "2"

# ── 冷门格式插件 IPC 协议（Part2）─────────────────────────────────────────────────
# 与各 Worker 二进制共享同一份帧编解码/消息/错误码定义（路径依赖，随主程序构建）。
exotic-protocol = { path = "../crates/exotic-protocol" }

# 系统凭据服务共用命名常量。
scrollery-plugin-api = { path = "../crates/scrollery-plugin-api" }

# 插件包与 registry 公钥验签；发布通过 PICASA_EXOTIC_KEYSET_FILE 注入信任根。
scrollery-exotic-trust = { path = "../crates/scrollery-exotic-trust" }

# ── AI 推理核心(Part4-T15 迁出)────────────────────────────────────────────────────
# 主进程仅消费模型契约与纯类型，关闭 inference 以免链接 ORT 和 tokenizers。
scrollery-ai-core = { path = "../crates/scrollery-ai-core", default-features = false }

# ── Hashing ───────────────────────────────────────────────────────────────────
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# ── Image processing ──────────────────────────────────────────────────────────
image              = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif", "tiff"] }
# 仅需编辑几何算子；关闭默认特性，避免启用字体、FFT 等依赖。
imageproc          = { version = "0.27", default-features = false }
# 编辑预览与调色使用 ICC 色彩转换。
moxcms             = "0.8.1"
# 有损缩略图使用 libwebp，避免无损 WebP 过大增加缓存驱逐与自愈。
# 关闭 img 特性，编码路径无需与 image crate 互转。
webp               = { version = "0.3", default-features = false }
fast_image_resize  = "4"
thumbhash          = "0.1"
# ── EXIF / XMP ───────────────────────────────────────────────────────────────
kamadak-exif = "0.5"
quick-xml    = { version = "0.36", features = ["serialize"] }

# ── Documents（P4，§3.4/§7）─────────────────────────────────────────────────────
# EPUB 容器读取与备份打包使用 ZIP，仅启用 deflate。
zip = { version = "2", default-features = false, features = ["deflate"] }
# 文档版本按需生成行级差异。
similar = "2"
# 远程校对、下载与网络存储共用 rustls 客户端。
# cookie jar 保持下载源的跨跳与跨请求会话，避免 WAF 返回异常内容。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
# API Key 等凭据存系统凭据库，不落明文数据库。
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
# 音频封面、标签与歌词提取。
lofty = "0.22"

# ── 阅读器文本管线（阅读器完善方案 R1，§5.1/§5.2）────────────────────────────────
# chardetng：Firefox 的编码启发式检测器（同源 encoding_rs）。纯 Rust、宽松许可（Apache-2.0/MIT）。
#   仅用于 txt 无 BOM 时的编码猜测（喂前 64KB）；UTF-16 系不测（由 BOM 层 + 零字节启发兜底）。
chardetng = "0.1"
# 按检测或覆盖编码解码为 UTF-8，并处理 BOM 与替换率。
encoding_rs = "0.8"
# txt 分章规则使用正则；不支持的负向断言由 deny_suffix 后过滤实现。
regex = "1"
# 纯 Rust 简繁转换，词典内置；前端在替换规则之后按章调用。
ferrous-opencc = "0.4"

# ── 网络盘（P5，§3.8）─────────────────────────────────────────────────────────────
# WebDAV 原生客户端由 netfs 特性启用；OS 挂载盘与 UNC 无需该依赖。
reqwest_dav = { version = "0.1", optional = true }

# ── CPU parallelism ───────────────────────────────────────────────────────────
rayon = "1"

# ── File system traversal ─────────────────────────────────────────────────────
walkdir = "2"
# Windows 规范化路径可能带 verbatim 前缀；dunce 在安全时去除前缀，以供系统文件管理器使用。
dunce = "1"
# 跨平台复制不保证保留 mtime，导出时需显式恢复源文件修改时间。
filetime = "0.2"

# ── Logging ───────────────────────────────────────────────────────────────────
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono", "json"] }
tracing-appender   = "0.2"
# panic 消息与 backtrace 作为 ERROR 日志落盘。
tracing-panic      = "0.1"

# ── Utilities ─────────────────────────────────────────────────────────────────
chrono   = { version = "0.4", features = ["serde"] }
crossbeam-channel = "0.5.15"
# 摘要读取使用 O_NOFOLLOW/FILE_FLAG_OPEN_REPARSE_POINT，避免路径在 stat 与 open
# 之间变成链接后被跟随；libc 只用于 Unix 的标准 no-follow 打开标志。
libc = "0.2"

# ── AI ────────────────────────────────────────────────────────────────────────
# 嵌入向量缓存使用半精度存储，相比 f32 减半内存占用。
half      = "2"
# 模型下载内容与注册表的 SHA-256 对照校验。
sha2 = "0.10"
# blake3：精确去重摘要（与 content_hash 的扫描变更指纹严格分离）。
blake3 = "1.5"

# ── 冷门格式插件 · 信任根与验签（Part3 P5/P6）─────────────────────────────────────
# 离线 Ed25519 验证 License、Registry 与 package manifest；主进程只持公钥。
ring = "0.17"
# License token 使用 base64url(payload).base64url(sig)，公钥也以 base64 表示。
base64 = "0.22"
wallpaper = "3.2"
arboard = "3.6.1"
trash = "5.2.6"

# ── 配置文件子系统(A1,设置类键唯一真源迁往 <app_data_dir>/config.toml)───────────────
# TOML 读写保留既有注释与排版，语法错误可按 span 报行列位置。
toml_edit = { version = "0.25", features = ["serde"] }
# 监听配置所在目录并按文件名过滤，兼容编辑器的 tmp+rename 保存方式。
notify = "8"

[target.'cfg(unix)'.dependencies]
# 暂存清理沿已打开的目录句柄递归，避免检查后路径被替换时跟随到边界外。
rustix = { version = "1.1.4", features = ["fs"] }

# Windows 原生 API 仅在 cfg(windows) 目标编译，用于图像、媒体、卷与窗口功能。
# ProcessStatus 同时用于 examples/edit_memory_probe.rs 的内存峰值探针。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["implement", "Win32_Graphics_Imaging", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi", "Win32_Media_MediaFoundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_ProcessStatus",
    "Win32_System_JobObjects",
    "Foundation_Numerics", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_Dxgi_Common",
    "Win32_Security", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# `#[implement]` 宏(media_foundation.rs 的 IMFSourceReaderCallback 异步回调)展开出 `::windows_core`
# 绝对路径,需 windows-core 作为直接依赖在 crate 根可见(版本随 windows 0.58 锁到同一 0.58.0)。
windows-core = "0.58"
# DWM 背板按平台能力回退，需要 Result 判断失败，见 window_material.rs。
window-vibrancy = "0.6"

[dev-dependencies]
# 仅**测试/dev** 构建启用 exotic-trust 的 test-support feature：暴露 crypto 的确定性签名/keyset 构造
# 工具给 src-tauri 的 installer/registry/package/install 测试（`#[cfg(test)]` 项不跨 crate 可见，故
# 改用 feature 门控）。cargo 对同一 path crate 的 [dependencies]（无 feature）与 [dev-dependencies]
# （含 feature）做 feature 并集：普通 `cargo build` 不启用 → 测试密钥绝不编入 Release。
scrollery-exotic-trust = { path = "../crates/scrollery-exotic-trust", features = ["test-support"] }
# lexicmp 仅作 natural_sort 对拍基准；生产比较器自行处理可能溢出 u64 的长数字段。
lexicmp = "0.2.0"
# Little CMS 仅作编辑色彩链的测试参考，static 避免依赖目标机系统库。
lcms2 = { version = "6.1.1", features = ["static"] }
# 日志关闭、过滤、全开状态与流水线的性能基准。
criterion = "0.5"

[[bench]]
name = "logging"
harness = false

[features]
# 默认采用 Lite 标记，custom-protocol 用于 Tauri 生产构建。
default = ["custom-protocol", "lite"]
custom-protocol = ["tauri/custom-protocol"]
# Release 诊断构建按需启用 inspector，debug 构建无需此开关。
devtools = ["tauri/devtools"]

# 开发测试授权同时受 feature 与 debug_assertions 门控，Release 不启用跳过授权的路径。
exotic-dev-fixtures = []

# Lite 是构建标记，Perf 启用 netfs 并包含 ffmpeg 标记；Windows 原生媒体后端两者均可用。
lite = []
perf = ["ffmpeg", "netfs"]
# ffmpeg 保留为空构建标记；视频插件的 worker 路径不由此特性实现。
ffmpeg = []
# netfs 编入 reqwest_dav 与 WebDAV 存储后端；Lite 可访问 OS 挂载盘与 UNC。
netfs = ["dep:reqwest_dav"]

# ── 合规隔离(Part4-T1 / Part4 §3.10.1)─────────────────────────────────────────
# face-noncommercial:SCRFD/ArcFace 非商用轨(InsightFace 权重仅限非商业研究)。
# 默认与商业 build 不含 → 该轨代码/onnx 文件名常量/serde 变体字面量**物理不编译**
# (不能只靠运行时不可达);仅研究/自用构建显式 --features face-noncommercial 开启。
# 商业流水线(Part7 T16/17)另有符号扫描断言兜底(二进制不得含 scrfd/arcface/w600k)。
# T15 起转发至 ai-core(SCRFD/ArcFace 代码已随推理核迁出,cfg 门控单一事实源在彼处)。
face-noncommercial = ["scrollery-ai-core/face-noncommercial"]

# 当前采用直销渠道，授权、Registry 验签与 HTTPS 下载由运行时配置及组件实现。

# 构建 profile 仅在 workspace 根生效，Release 与 Lite 参数见 ../Cargo.toml。
