# crates/exotic-workers/raw-probe/Cargo.toml
# RAW 技术去险 spike(阶段 B 前置)。实验 crate，独立 workspace（不进根 members——见下）。
# 目的：证 rsraw（vendored LibRaw C++，CDDL/LGPL 双证）能否在 x86_64-pc-windows-gnu
# 工具链上真编出来 + API 面可用 + 畸形输入 panic 安全。
# 锁定精确版本（`=0.1.1`），结论只对该版本成立；升级须重跑探针。
#
# 🔴 rsraw 的 build.rs（经 rsraw-sys）在 MSVC 下 `panic!("MSVC is not supported")`，
#    故本 crate 只能用 --target x86_64-pc-windows-gnu 编译，绝不可能在默认 msvc 工具链下编译。
# 🔴 因此本 crate 刻意**不**加入根 Cargo.toml 的 workspace members：加入会在默认
#    `cargo build`（msvc host）时把整个 workspace 拖进 MSVC panic。用下面这个空
#    `[workspace]` 表把本 crate 从父 workspace 摘出，独立构建/运行。

[workspace]

[package]
name = "raw-probe"
version = "0.0.0"
edition = "2021"
# 第一方许可(2026-09-14 决议):本 crate 独立 workspace,不继承根 [workspace.package],故显式声明。
license = "AGPL-3.0-only"
publish = false

[[bin]]
name = "raw-probe"
path = "src/main.rs"

[dependencies]
# 候选解码 crate：LibRaw 的 Rust 包装（vendored C++，见 crate 内 rsraw-sys）。精确锁定。
rsraw = "=0.1.1"
