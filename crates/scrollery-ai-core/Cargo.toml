# crates/scrollery-ai-core/Cargo.toml
# AI 推理核心：ORT Session 池、CLIP、人脸、OCR、增强推理与模型契约。
# ai-worker 启用 inference 消费推理面；
# src-tauri 关默认特性,只消费纯契约面(profile 注册表/embedding 字节序/face_types/decoded)。
#
# ort 特性说明:load-dynamic 激活 ort-sys/disable-linking,download-binaries 实际不运行
# (见 engine.rs)；ORT 版本在本文件管理。

[package]
name = "scrollery-ai-core"
version = "0.1.0"
edition = "2021"
license.workspace = true # 第一方许可:AGPL-3.0-only(2026-09-14 决议,根 [workspace.package] 单一事实源)
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "1"
tracing = "0.1"

# ── AI 推理依赖：随 `inference` feature 启停 ──────────────────────────────
ort = { version = "2.0.0-rc.12", features = ["load-dynamic", "directml", "download-binaries", "copy-dylibs"], optional = true }
ndarray = { version = "0.16", optional = true }
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"], optional = true }

# ── 图像预处理(resize/crop/像素访问;解码格式面由消费方各自声明)──────────────────
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff"], optional = true }

# ── OCR 几何(轮廓/最小外接旋转矩形/透视 warp);major 对齐 image 0.25(imageproc 0.27)。
#    与 src-tauri 同版本 0.27;仅 inference 面消费(ocr::det/geometry)。
imageproc = { version = "0.27", default-features = false, optional = true }

# ── SessionPool 的有界 channel(RAII 归还)─────────────────────────────────────────
crossbeam-channel = { version = "0.5.15", optional = true }

# ── Windows 原生 API:provider::detect_vram_bytes 的 DXGI 探测(target 限定)─────────
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Graphics_Dxgi"], optional = true }

[features]
# 缺省启用推理面。
default = ["inference"]
# 推理面：ORT Session 池、CLIP、人脸、OCR、增强与执行提供器探测。
# src-tauri 使用 `default-features = false`，只消费纯契约面
# (profile/face_profile 注册表、face_types 几何、embedding 字节序、decoded 类型)。
inference = [
    "dep:ort",
    "dep:ndarray",
    "dep:tokenizers",
    "dep:image",
    "dep:imageproc",
    "dep:crossbeam-channel",
    "dep:windows",
]
# 合规隔离(Part4-T1):SCRFD/ArcFace 非商用轨物理不编译;src-tauri 与 ai-worker 的
# 同名 feature 转发至此(单一事实源仍是本 crate 的 cfg 门控)。
face-noncommercial = []
