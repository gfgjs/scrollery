# Windows x64 开发进程及其 worker 从 npm 依赖加载 ORT；其余 DLL 位于同一目录。
# 外部设置的 ORT_DYLIB_PATH 优先。本路径不适用于其他平台，也不会自动注入安装版。
# 打包运行时由 scripts/build-ai-worker.mjs 复制到 worker 旁。
# CI 的 Rust job 不安装 npm 依赖；真实 ORT 测试需单独准备运行时，不能直接依赖此路径。
[env]
ORT_DYLIB_PATH = { value = "node_modules/onnxruntime-node/bin/napi-v6/win32/x64/onnxruntime.dll", relative = true }
