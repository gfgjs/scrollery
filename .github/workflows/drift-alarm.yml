# 公开仓由私有仓投影；直接提交会被下次同步覆盖。
# 在公开仓 sync-staging/main 的 push 上检查 HEAD 作者是否为 sync-bot。
# 仓库守卫使本工作流只在公开仓执行。
name: drift-alarm

on:
  push:
    branches: [ "sync-staging", "main" ]

jobs:
  author-check:
    name: 反向漂移告警
    # 只在公开仓执行。
    if: github.repository == 'gfgjs/scrollery'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 断言 HEAD 作者为 sync-bot
        run: |
          expected="sync-bot@users.noreply.github.com"
          actual="$(git log -1 --format=%ae)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::反向漂移:HEAD 作者 [$actual] 不是 sync-bot——公开仓的直接改动会被下次 SQUASH 同步无声覆盖;请把改动提交到私有 canonical 仓走同步管线"
            exit 1
          fi
          echo "✓ HEAD 由 sync-bot 提交($actual)"
