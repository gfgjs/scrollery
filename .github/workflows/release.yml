# 公开仓免费版发布：v* tag 创建 release，手动触发上传验收工件。
# 仓库守卫限制公开仓执行；本工作流不使用签名凭据。
# 发布说明取自 CHANGELOG.md 对应版本小节，缺失时中止发布。
name: OSS Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch: # dry-run:构建与校验全跑,产物上传 artifact,不发布

# 同一 ref 的发布串行执行，避免产物竞态。
concurrency:
  group: oss-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # gh release create 需要;dry-run 路径不消费

jobs:
  release:
    name: 免费版构建与发布
    if: github.repository == 'gfgjs/scrollery'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash # GitHub 显式 bash 使用 -eo pipefail
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 编译缓存
        uses: Swatinem/rust-cache@v2

      - name: npm ci
        run: npm ci

      - name: 补装 raw-worker 依赖 target
        run: |
          rustup target add x86_64-pc-windows-gnu
          where.exe dlltool
          where.exe g++

      - name: NOTICE 归属清单与 SBOM 门
        run: |
          # 校验 NOTICE 新鲜度后生成 SBOM；校验失败不写 SBOM。
          node scripts/generate-notice.mjs --check --sbom

      # ── 发布硬门三连(任一红即不发布)─────────────────────────────────────────
      - name: tag 与版本锚一致性
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/sync-version.mjs --check-tag "$GITHUB_REF_NAME"

      - name: 提取发布说明(CHANGELOG 硬门)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ver="${GITHUB_REF_NAME#v}"
          node scripts/extract-changelog.mjs "$ver" > release-notes.md
          echo "--- 发布说明预览 ---"
          cat release-notes.md

      # ── 构建(tauri CLI 在 windows runner 自动拉取 NSIS/WiX 工具链)────────────
      # dist 由 beforeBuildCommand 构建，并用于当前安装包。
      - name: tauri build(免费版,含 MSI + NSIS 安装包)
        run: npx tauri build

      # 扫描上述构建产出的 dist。
      - name: 发布合规扫描(verify-channel-bundle)
        run: node scripts/verify-channel-bundle.mjs

      # 发布 SHA 上复跑测试门控(oss-gate 在 sync-staging 验过,此处对 tag SHA 再取证)。
      # 排在构建之后:既保证 dist 已存在(tauri-build 需要 frontendDist 就位),又使测试失败
      # 在此中断——后面的包体断言、产物清单与 gh release 都不会执行,失败不得发布。
      - name: 全仓测试预算
        run: npm run check:tests

      - name: cargo test --workspace
        run: cargo test --workspace --locked

      # 核对 worker 与 ORT DLL 实际落入安装包载荷。
      - name: 安装包内容断言(raw/ai/video/enhance worker + ORT DLL)
        run: node scripts/verify-bundle-content.mjs

      - name: 产物清单 + SHA-256
        run: |
          mkdir -p release-assets
          # bundle 布局:target/release/bundle/msi/*.msi + bundle/nsis/*-setup.exe
          find target/release/bundle -type f \( -name "*.msi" -o -name "*-setup.exe" \) -exec cp {} release-assets/ \;
          count=$(ls release-assets | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::bundle 未产出任何安装包(MSI/NSIS 均缺失)"; exit 1
          fi
          (cd release-assets && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      # ── 出口二选一:dispatch=dry-run 传工件;tag=正式发布 ─────────────────────
      - name: dry-run 工件上传(仅 workflow_dispatch)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: oss-release-dryrun
          path: release-assets/
          retention-days: 7

      - name: gh release 发布(仅 tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            cat release-notes.md
            echo ""
            echo "## SHA-256"
            echo '```'
            cat release-assets/SHA256SUMS.txt
            echo '```'
          } > release-body.md
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --title "Scrollery $GITHUB_REF_NAME(免费版)" \
            --notes-file release-body.md
