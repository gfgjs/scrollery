# CI —— 私有 canonical 仓的提交门控。
#
# Rust 检查在 workspace 根执行；占位 dist 供 generate_context! 校验 frontendDist。
name: CI

on:
  push:
    branches: [ "main", "dev" ]
    tags: [ "v*" ] # 冒烟仅在 release tag 或手动触发时运行
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

jobs:
  # Windows 与 Linux 检查使用私有仓自托管 runner。
  # 仓库 guard 防止公开镜像任务等待私有 runner；公开树由 oss-gate 校验。
  # 自托管 runner 不挂到公开仓，避免 fork PR 执行任意代码。
  rust:
    name: Rust Check & Clippy & Test
    if: github.repository == 'gfgjs/scrollery-private'
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: bash # windows runner 默认 pwsh;与 oss-gate 对齐用 bash,mkdir -p 等脚本可移植
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: 补装 raw-worker 依赖 target
        run: rustup target add x86_64-pc-windows-gnu

      # 编译缓存:仅托管 runner 需要(冷机);自托管 _work 目录本身持久,再走 GitHub cache 纯网络往返浪费,
      # 且 restore 会用陈旧缓存覆盖更新的本地 target(runner.environment 是 GitHub 内置上下文)。
      - name: Rust 编译缓存
        if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@v2

      # ⚠ 推理测试红线:rust/rust-linux 两 job 均无 npm 步骤,.cargo/config.toml 的 ORT_DYLIB_PATH
      #   相对指向 node_modules 在 CI 上落空——一切真加载 ORT(load_session_pool 类)的测试必须
      #   #[ignore] 手跑;若要让此类测试进 CI,须同一变更给两 job 补 npm ci(或单包 materialize)
      #   步骤,否则报 ModelLoadFailed 假故障。.cargo/config.toml 侧有对称注释。

      # generate_context! 编译期校验 frontendDist("../dist")存在。
      - name: 占位 dist(generate_context 校验 frontendDist)
        run: mkdir -p dist

      # fmt 门:AGENTS.md 规定 rustfmt+clippy 双工具。--check 零编译,秒级;fmt 与平台无关,
      # 单跑 Windows 主 job,rust-linux 不重复。
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy --workspace
        run: cargo clippy --workspace --locked -- -D warnings

      - name: cargo test --workspace
        run: cargo test --workspace --locked

      # NOTICE 归属清单新鲜度门:lockfile 变更未重生成 NOTICE.md 即红。
      # 脚本零依赖(node 内置模块,runner 自带 node);cargo tree 只解析不编译,秒级。
      - name: NOTICE 归属清单新鲜度(generate-notice --check)
        run: node scripts/generate-notice.mjs --check

  # ── Linux 编译+测试面 ──────────────────────────────────────────────────────
  # 验证 Linux 编译与测试，覆盖平台条件编译路径。
  # 范围:check+test(与 gate 对齐);clippy 维持 windows job 单点(lint 与平台无关,
  # 不重复付费;Linux 特有 cfg 死代码若出现由 check 的 warning 面先暴露)。
  rust-linux:
    name: Rust Check & Test (Linux 编译面)
    # 使用 WSL2 自托管 runner。
    if: github.repository == 'gfgjs/scrollery-private'
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      # Tauri v2 Linux 前置(webkit2gtk 4.1 等;官方 prerequisites 清单)。
      # 仅托管 runner 需要:自托管 WSL 已预装同清单;且自托管无免密 sudo,此步跑了必卡。
      - name: Tauri Linux 系统依赖
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 编译缓存
        if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@v2

      - name: 占位 dist(generate_context 校验 frontendDist)
        run: mkdir -p dist

      # 未安装 npm 依赖，真实 ORT 测试需单独准备运行时，见 Windows Rust job 说明。
      - name: cargo test --workspace
        run: cargo test --workspace --locked

  frontend:
    name: Frontend Typecheck & Test
    # 自托管(见 rust job 注):node 脚本与 npm 命令均跨平台,Windows 本机可跑;默认 pwsh 即可(无 bash 语法步骤)。
    if: github.repository == 'gfgjs/scrollery-private'
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci 而非 npm install:锁定 package-lock,可复现且更快(与 oss-gate 对齐)。
      - name: npm ci
        run: npm ci

      # Part7-T5 版本单源门控:package.json 与锚(根 [workspace.package] version)一致、
      # tauri.conf.json 无独立 version、src-tauri 走 workspace 继承;失配则提示 --write。
      - name: 版本单源检查(sync-version --check)
        run: node scripts/sync-version.mjs --check

      # 2026-07-11 加固批 A-5(事故防复发):嵌套 cargo config + 配置文件盘符绝对路径拦截。
      # 起因=src-tauri/.cargo/config.toml 死路径就近劫持 tauri dev(experience.md §5),纯静态秒级。
      - name: 路径卫生门禁(check-path-hygiene)
        run: node scripts/check-path-hygiene.mjs

      - name: IPC 命令定义、注册与前端常量对拍
        run: npm run check:ipc

      # exotic 协议版本跨语言同步门(2026-07-13 事故防复发):Rust frame.rs 与 JS exotic-signing.mjs
      # 的 PROTOCOL_VERSION 必须相等——升 host 漏改 JS 会令打包器把旧版本号烙进插件清单被 installer
      # 启动前复核判 protocol_mismatch 拒装(psd 插件根因)。检查当前两端真实常量。
      - name: exotic 协议版本同步门(check-exotic-protocol-sync)
        run: node scripts/check-exotic-protocol-sync.mjs

      # R2-3:存量 33 lint 错清零后开硬门(含 R1-7 的 vue/no-bare-strings-in-template i18n 防回潮规则)。
      - name: ESLint
        run: npm run lint

      - name: vue-tsc 类型检查
        run: npm run typecheck

      - name: 全仓测试预算（Rust平台并集、脚本验收及展开用例）
        run: npm run check:tests -- --selftest

      - name: vitest 单元测试
        run: npm test

      # Part7 §3.6.5⑤:conf/capability/dist 发布合规扫描(updater 块只许住 direct 发布 overlay)。
      # 🔴 必须扫 minify 后生产 bundle(原型实证:未 minify 的 if(false) 死块函数名残留会误报);
      # 此步骤扫描实际生产包的渠道与权限内容。
      - name: vite build(生产 bundle)
        run: npm run build

      - name: 发布合规扫描(verify-channel-bundle)
        run: node scripts/verify-channel-bundle.mjs

  # ── 开机冒烟 —— 只在 release tag / 手动 dispatch 上跑 ──────────────────────────
  # 日常 push 保持轻量(本 job 含完整 tauri build,windows runner 上 10 分钟级)。
  # 🔴 须跑构建产物:frontendDist 编译期内嵌;tauri dev 依赖 vite devUrl,不适合无头冒烟。
  # --no-bundle 只产 exe 不打安装包,exe 原地可跑(bundle 无 ONNX/DirectML 资源;
  # 冒烟只验开机就绪,不触 AI 推理)。
  # 钩子机制:lib.rs 的 RunEvent::Ready 分支检测 PICASA_SMOKE_TEST=1 → 就绪即 exit(0);
  # setup 中途 panic(reactor/迁移/DB)→ 永不到 Ready → 非零退出,本步即红。
  smoke:
    name: 开机冒烟(build 产物断言)
    if: github.repository == 'gfgjs/scrollery-private' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, Windows, X64] # 自托管(见 rust job 注);tauri build 本机温缓存快一个量级
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 编译缓存
        if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@v2

      - name: Node 环境(npm 缓存)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci

      # tag 一致性:tag vX.Y.Z 必须等于版本锚,防 tag 与产物版本漂移。
      - name: tag 与版本锚一致性
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/sync-version.mjs --check-tag "$GITHUB_REF_NAME"

      - name: tauri build --no-bundle(release exe)
        run: npx tauri build --no-bundle

      # 发货闭包 staging 断言:--no-bundle 无安装包,
      # 本步只验 staging 文件 + conf 接线;安装包载荷级断言在 release.yml 拆包硬验。
      - name: 发货闭包断言(staging + conf)
        run: node scripts/verify-bundle-content.mjs

      - name: 开机冒烟断言(PICASA_SMOKE_TEST=1 → exit 0)
        timeout-minutes: 5
        run: |
          PICASA_SMOKE_TEST=1 ./target/release/scrollery.exe
          echo "冒烟通过:应用达 RunEvent::Ready 并 exit(0)"

  # ── RAW 独立 workspace 验证 ─────────────────────────────────────────────────
  # raw-worker 刻意脱离根 workspace(rsraw 的 build.rs 在 MSVC 下硬 panic),只能 gnu target 单独编译,
  # 因此天然落在 `cargo test --workspace`(rust/rust-linux 两 job)之外。本 job 用
  # scripts/acceptance/raw-worker-test.mjs 一条命令固化:结构守卫(仍在 workspace 外 + 未进根
  # lockfile)+ fmt + test --locked --target gnu + 产物存在性。
  raw-worker:
    name: RAW Worker(gnu 独立 workspace)
    if: github.repository == 'gfgjs/scrollery-private'
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # 与 rust job 同款前置:gnu target 缺失时 cargo 只报难读的 linker 错,先补 target 再测。
      - name: 补装 raw-worker 依赖 target
        run: rustup target add x86_64-pc-windows-gnu

      - name: RAW 独立验证(结构守卫 + fmt + test + 产物)
        run: node scripts/acceptance/raw-worker-test.mjs --expect-binary
