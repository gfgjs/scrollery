# 公开仓 sync-staging 的构建、测试与密钥扫描门禁。
# 文件随投影进入公开仓；仓库守卫限制执行位置。
name: oss-gate

on:
  push:
    branches: [ "sync-staging" ]
  workflow_dispatch:

jobs:
  gate:
    name: OSS 投影构建 gate
    # 只在公开仓执行。
    if: github.repository == 'gfgjs/scrollery'
    runs-on: ubuntu-latest
    # 本 job 只做源码编译与单测，发行资源由 release 打包门验证。
    env:
      TAURI_CONFIG: '{"bundle":{"externalBin":[],"resources":[]}}'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout sync-staging
        uses: actions/checkout@v4

      # Tauri v2 Linux 前置(webkit2gtk 4.1 等;与私有 ci.yml rust-linux job 同清单)。
      - name: Tauri Linux 系统依赖
        run: |
          sudo apt-get update
          # clang/libclang-dev:raw-worker 独立 workspace 的 Linux 构建前置(见下方 RAW 步骤)。
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev clang libclang-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # 编译缓存:gate 每次同步都跑,缓存 registry+target 大幅提速。
      - name: Rust 编译缓存
        uses: Swatinem/rust-cache@v2

      # 公开树同时验证前端类型、测试和实际构建产物。
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci

      - name: vue-tsc 类型检查
        run: npm run typecheck

      - name: 全仓测试预算
        run: npm run check:tests

      - name: vitest 单元测试
        run: npm test

      - name: vite build(生产 bundle)
        run: npm run build

      # 独立 RAW 提前检查，避免 workspace 测试失败时遗漏其构建结果。
      - name: cargo check(raw-worker 独立 workspace)
        run: cargo check --manifest-path crates/exotic-workers/raw-worker/Cargo.toml --locked

      # 使用同步来的 Cargo.lock 解析与编译，不重新生成锁文件。
      # 🔴 显式串行(--test-threads=1):不依赖 runner 默认并行度,换取确定性。
      - name: cargo test --workspace --locked
        run: cargo test --workspace --locked -- --test-threads=1


  # 密钥扫描:防私钥 / 私密签发凭证意外混入公开树或其历史(验签公钥本就可公开,不在此列;
  #    独立 ubuntu job,与 gate 并行)。
  #    gitleaks-action@v2 在 Ubuntu 上运行。
  gitleaks:
    name: gitleaks 密钥扫描
    if: github.repository == 'gfgjs/scrollery'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # 扫描全部历史
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
